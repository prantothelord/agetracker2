          python3 -c '
          import glob, os, re

          main_files = glob.glob("android/app/src/**/MainActivity.kt", recursive=True)
          if not main_files:
              raise RuntimeError("MainActivity.kt not found")
          main_path = main_files[0]
          pkg_dir = os.path.dirname(main_path)

          with open(main_path, "r", encoding="utf-8") as f:
              src = f.read()

          pkg_match = re.search(r"^\s*package\s+([a-zA-Z0-9_.]+)", src, re.M)
          pkg_name = pkg_match.group(1) if pkg_match else "com.familyage.family_age_widget"

          providers_code = f"""package {pkg_name}

import android.app.PendingIntent
import android.appwidget.AppWidgetManager
import android.appwidget.AppWidgetProvider
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import android.widget.RemoteViews

object WidgetSyncHelper {{
    fun updateAll(context: Context) {{
        val prefs = context.getSharedPreferences("family_age_store", Context.MODE_PRIVATE)
        val father = prefs.getString("fatherLine", "Father: Set DOB") ?: "Father: Set DOB"
        val mother = prefs.getString("motherLine", "Mother: Set DOB") ?: "Mother: Set DOB"
        val child = prefs.getString("childLine", "Child: Set DOB") ?: "Child: Set DOB"
        val fSub = prefs.getString("fatherSub", "") ?: ""
        val mSub = prefs.getString("motherSub", "") ?: ""
        val cSub = prefs.getString("childSub", "") ?: ""

        val mgr = AppWidgetManager.getInstance(context)
        val openIntent = Intent(context, MainActivity::class.java)
        val pending = PendingIntent.getActivity(
            context,
            0,
            openIntent,
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )

        val smallIds = mgr.getAppWidgetIds(ComponentName(context, FamilySmallWidgetProvider::class.java))
        for (id in smallIds) {{
            val views = RemoteViews(context.packageName, R.layout.widget_small)
            views.setTextViewText(R.id.w_small_child, child)
            views.setTextViewText(R.id.w_small_sub, "$father • $mother")
            views.setOnClickPendingIntent(R.id.widget_root, pending)
            mgr.updateAppWidget(id, views)
        }}

        val medIds = mgr.getAppWidgetIds(ComponentName(context, FamilyMediumWidgetProvider::class.java))
        for (id in medIds) {{
            val views = RemoteViews(context.packageName, R.layout.widget_medium)
            views.setTextViewText(R.id.w_med_father, father)
            views.setTextViewText(R.id.w_med_mother, mother)
            views.setTextViewText(R.id.w_med_child, child)
            views.setOnClickPendingIntent(R.id.widget_root, pending)
            mgr.updateAppWidget(id, views)
        }}

        val largeIds = mgr.getAppWidgetIds(ComponentName(context, FamilyLargeWidgetProvider::class.java))
        for (id in largeIds) {{
            val views = RemoteViews(context.packageName, R.layout.widget_large)
            views.setTextViewText(R.id.w_lg_father, father)
            views.setTextViewText(R.id.w_lg_father_sub, fSub)
            views.setTextViewText(R.id.w_lg_mother, mother)
            views.setTextViewText(R.id.w_lg_mother_sub, mSub)
            views.setTextViewText(R.id.w_lg_child, child)
            views.setTextViewText(R.id.w_lg_child_sub, cSub)
            views.setOnClickPendingIntent(R.id.widget_root, pending)
            mgr.updateAppWidget(id, views)
        }}
    }}
}}

class FamilySmallWidgetProvider : AppWidgetProvider() {{
    override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {{
        WidgetSyncHelper.updateAll(context)
    }}
}}

class FamilyMediumWidgetProvider : AppWidgetProvider() {{
    override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {{
        WidgetSyncHelper.updateAll(context)
    }}
}}

class FamilyLargeWidgetProvider : AppWidgetProvider() {{
    override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {{
        WidgetSyncHelper.updateAll(context)
    }}
}}
"""
          with open(os.path.join(pkg_dir, "FamilyWidgetProviders.kt"), "w", encoding="utf-8") as f:
              f.write(providers_code)

          main_code = f"""package {pkg_name}

import android.content.Context
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterActivity() {{
    private val channelName = "com.familyage/widget"

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler {{ call, result ->
            val prefs = getSharedPreferences("family_age_store", Context.MODE_PRIVATE)
            when (call.method) {{
                "loadState" -> result.success(prefs.getString("familyJson", ""))
                "saveAndSync" -> {{
                    prefs.edit()
                        .putString("familyJson", call.argument<String>("json") ?: "")
                        .putString("fatherLine", call.argument<String>("fatherLine") ?: "")
                        .putString("motherLine", call.argument<String>("motherLine") ?: "")
                        .putString("childLine", call.argument<String>("childLine") ?: "")
                        .putString("fatherSub", call.argument<String>("fatherSub") ?: "")
                        .putString("motherSub", call.argument<String>("motherSub") ?: "")
                        .putString("childSub", call.argument<String>("childSub") ?: "")
                        .apply()
                    WidgetSyncHelper.updateAll(this)
                    result.success(true)
                }}
                else -> result.notImplemented()
            }}
        }}
    }}
}}
"""
          with open(main_path, "w", encoding="utf-8") as f:
              f.write(main_code)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          manifest = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"Family Age\"", manifest, count=1)

          receivers = """
        <receiver
            android:name=".FamilySmallWidgetProvider"
            android:exported="true">
            <intent-filter>
                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
            </intent-filter>
            <meta-data
                android:name="android.appwidget.provider"
                android:resource="@xml/widget_small_info" />
        </receiver>
        <receiver
            android:name=".FamilyMediumWidgetProvider"
            android:exported="true">
            <intent-filter>
                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
            </intent-filter>
            <meta-data
                android:name="android.appwidget.provider"
                android:resource="@xml/widget_medium_info" />
        </receiver>
        <receiver
            android:name=".FamilyLargeWidgetProvider"
            android:exported="true">
            <intent-filter>
                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
            </intent-filter>
            <meta-data
                android:name="android.appwidget.provider"
                android:resource="@xml/widget_large_info" />
        </receiver>
    </application>"""

          if "FamilySmallWidgetProvider" not in manifest:
              manifest = re.sub(r"\s*</application>", receivers, manifest, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)
          '

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Family-Age.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Family-Age-APK
          path: build/app/outputs/flutter-apk/Family-Age.apk
