name: Build Family Age Widget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Android Widgets & MainActivity
        run: |
          flutter create --platforms=android --org=com.familyage --project-name=family_age_widget .

          mkdir -p android/app/src/main/res/xml android/app/src/main/res/layout

          cat << 'EOF' > android/app/src/main/res/xml/widget_small_info.xml
